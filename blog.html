  <!-- Marked.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);

        <button class="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>

          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Blog Header -->
  <div class="blog-page-header">
    <div class="container">
      <a href="index.html" class="back-link" id="back-link">&larr; Home</a>
      <h1 class="section-title" id="blog-title">Blog</h1>
      <p class="blog-page-subtitle" id="blog-subtitle">Notes on research, tutorials, and reading.</p>
    </div>
  </div>

  <!-- Blog List (shown when no post selected) -->
  <div class="blog-page-content" id="blog-list">
    <div class="container" id="blog-list-container">
      <p style="color: var(--text-light);">Loading posts...</p>
    </div>
  </div>

  <!-- Blog Post Content (hidden by default, shown when post selected) -->
  <div class="blog-page-content" id="blog-post" style="display:none">
    <div class="container">
      <div class="blog-post-body" id="post-content"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      &copy; 2025 Chaoyi Pan &middot; Carnegie Mellon University
